[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maintainer-signal"
version = "0.1.0"
description = "A local-first triage brief generator for open source maintainers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Maintainer Signal contributors" }
]
keywords = ["open-source", "maintainers", "triage", "github", "issues"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Bug Tracking",
  "Topic :: Software Development :: Quality Assurance"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/chinawa1683-source/maintainer-signal"
Issues = "https://github.com/chinawa1683-source/maintainer-signal/issues"

[project.scripts]
maintainer-signal = "maintainer_signal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
